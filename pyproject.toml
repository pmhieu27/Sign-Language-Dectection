[project]
name = "sign-language"
version = "0.1.0"
description = "Vietnamese Sign Language Detection using MediaPipe + CNN1D-LSTM"
readme = "README.md"
requires-python = "==3.10.20"
dependencies = [
    "av==15.1.0",
    "numpy==1.26.4",
    "python-dotenv>=0.9.9",
    "matplotlib>=3.9.0",
    "mediapipe==0.10.14",
    "opencv-python-headless==4.10.0.84",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "tensorflow-cpu==2.16.1",
    "streamlit>=1.45.1",
    "streamlit-webrtc==0.72.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyrefly]
project-includes = ["src"]
